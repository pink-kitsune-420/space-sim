name: Build and flight checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: space-lab-offline
          path: |
            dist/space-lab-offline.html
            dist/space-sim.spacegame
            dist/space-sim.spaceuniverse
            dist/universes/
      - uses: actions/upload-artifact@v4
        with:
          name: space-sim-server-node
          path: dist-server/space-sim-server.cjs
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 7
  server-executables:
    # One self-contained dedicated server per OS (Node single executable application).
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:server-exe
      - uses: actions/upload-artifact@v4
        with:
          name: space-sim-server-${{ runner.os }}
          path: |
            dist-server/space-sim-server
            dist-server/space-sim-server.exe
            dist-server/NODE-LICENSE.txt
          if-no-files-found: error
  game-executables:
    # One self-contained desktop game player per OS (Node single executable application).
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:game-exe
      - uses: actions/upload-artifact@v4
        with:
          name: space-sim-game-${{ runner.os }}
          path: |
            dist-desktop/space-sim
            dist-desktop/space-sim.exe
            dist-desktop/NODE-LICENSE.txt
          if-no-files-found: error

