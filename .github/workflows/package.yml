name: Auto Package Releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      run-id: ${{ steps.build.outputs.run-id }}
      sha: ${{ steps.build.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Reuse successful checks for this exact commit
        id: build
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/verified-build.cjs')({ github, context, core });

  package-desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            game_bin: dist-desktop/space-sim
            server_bin: dist-server/space-sim-server
          - os: windows-2025
            platform: windows
            game_bin: dist-desktop/space-sim.exe
            server_bin: dist-server/space-sim-server.exe
          - os: macos-15
            platform: macos
            game_bin: dist-desktop/space-sim
            server_bin: dist-server/space-sim-server
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Download tested distribution
        uses: actions/download-artifact@v8
        with:
          name: browser-build
          run-id: ${{ needs.verify.outputs.run-id }}
          github-token: ${{ github.token }}
          path: .
      - run: npm run build:game-exe
      - name: Verify packaged desktop startup and embedded player
        run: node scripts/smoke_desktop_exe.mjs "${{ matrix.game_bin }}"
      - run: npm run build:server-exe
      - uses: actions/upload-artifact@v4
        with:
          name: space-sim-${{ matrix.platform }}
          path: |
            ${{ matrix.game_bin }}
            ${{ matrix.server_bin }}
            dist-desktop/NODE-LICENSE.txt
            dist-server/NODE-LICENSE.txt
          if-no-files-found: error

  package-android:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm ci
      - name: Download tested distribution
        uses: actions/download-artifact@v8
        with:
          name: browser-build
          run-id: ${{ needs.verify.outputs.run-id }}
          github-token: ${{ github.token }}
          path: .
      - uses: gradle/actions/setup-gradle@v4
      - name: Stage tested web assets
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -a dist/. android/app/src/main/assets/public/
          cp LICENSE android/app/src/main/assets/public/LICENSE.txt
          cp CREDITS.md android/app/src/main/assets/public/CREDITS.md
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Verify Android embeds the tested player and project notices
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('android/app/build/outputs/apk/debug/app-debug.apk') as apk:
              for embedded, source in [('space-lab-offline.html', 'dist/space-lab-offline.html'),
                                       ('LICENSE.txt', 'LICENSE'), ('CREDITS.md', 'CREDITS.md')]:
                  assert apk.read('assets/public/' + embedded) == Path(source).read_bytes(), embedded
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: space-sim-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  distribution:
    # Publish only a complete desktop/server/Android distribution.
    needs: [verify, package-desktop, package-android]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.package-desktop.result == 'success' && needs.package-android.result == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.distribution.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
      - name: Download tested web distribution
        uses: actions/download-artifact@v8
        with:
          name: browser-build
          run-id: ${{ needs.verify.outputs.run-id }}
          github-token: ${{ github.token }}
          path: verified-build
      - name: Prepare Release Distribution Files
        id: distribution
        env:
          BUILD_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('snapshot-{0}', github.sha) }}
        run: |
          mkdir -p release-files
          TAG="$BUILD_TAG"

          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

          # Artifact uploads do not preserve POSIX executable permissions.
          find all-artifacts/space-sim-linux all-artifacts/space-sim-macos -type f \( -name space-sim -o -name space-sim-server \) -exec chmod 755 {} +

          # Linux Standalone Executables
          if [ -f all-artifacts/space-sim-linux/dist-desktop/space-sim ]; then
            tar -czf "release-files/space-sim-${TAG}-linux-x64.tar.gz" -C all-artifacts/space-sim-linux/dist-desktop space-sim NODE-LICENSE.txt
          elif [ -f all-artifacts/space-sim-linux/space-sim ]; then
            tar -czf "release-files/space-sim-${TAG}-linux-x64.tar.gz" -C all-artifacts/space-sim-linux space-sim NODE-LICENSE.txt
          fi

          # Linux Dedicated Server
          if [ -f all-artifacts/space-sim-linux/dist-server/space-sim-server ]; then
            tar -czf "release-files/space-sim-server-${TAG}-linux-x64.tar.gz" -C all-artifacts/space-sim-linux/dist-server space-sim-server NODE-LICENSE.txt
          elif [ -f all-artifacts/space-sim-linux/space-sim-server ]; then
            tar -czf "release-files/space-sim-server-${TAG}-linux-x64.tar.gz" -C all-artifacts/space-sim-linux space-sim-server NODE-LICENSE.txt
          fi

          # Windows Standalone Executables
          if [ -f all-artifacts/space-sim-windows/dist-desktop/space-sim.exe ]; then
            test -s all-artifacts/space-sim-windows/dist-desktop/NODE-LICENSE.txt
            (cd all-artifacts/space-sim-windows/dist-desktop && zip -j "../../../release-files/space-sim-${TAG}-windows-x64.zip" space-sim.exe NODE-LICENSE.txt)
          elif [ -f all-artifacts/space-sim-windows/space-sim.exe ]; then
            test -s all-artifacts/space-sim-windows/NODE-LICENSE.txt
            (cd all-artifacts/space-sim-windows && zip -j "../../release-files/space-sim-${TAG}-windows-x64.zip" space-sim.exe NODE-LICENSE.txt)
          fi

          # Windows Dedicated Server
          if [ -f all-artifacts/space-sim-windows/dist-server/space-sim-server.exe ]; then
            test -s all-artifacts/space-sim-windows/dist-server/NODE-LICENSE.txt
            (cd all-artifacts/space-sim-windows/dist-server && zip -j "../../../release-files/space-sim-server-${TAG}-windows-x64.zip" space-sim-server.exe NODE-LICENSE.txt)
          elif [ -f all-artifacts/space-sim-windows/space-sim-server.exe ]; then
            test -s all-artifacts/space-sim-windows/NODE-LICENSE.txt
            (cd all-artifacts/space-sim-windows && zip -j "../../release-files/space-sim-server-${TAG}-windows-x64.zip" space-sim-server.exe NODE-LICENSE.txt)
          fi

          # macOS Standalone Executables
          if [ -f all-artifacts/space-sim-macos/dist-desktop/space-sim ]; then
            tar -czf "release-files/space-sim-${TAG}-macos-arm64.tar.gz" -C all-artifacts/space-sim-macos/dist-desktop space-sim NODE-LICENSE.txt
          elif [ -f all-artifacts/space-sim-macos/space-sim ]; then
            tar -czf "release-files/space-sim-${TAG}-macos-arm64.tar.gz" -C all-artifacts/space-sim-macos space-sim NODE-LICENSE.txt
          fi

          # macOS Dedicated Server
          if [ -f all-artifacts/space-sim-macos/dist-server/space-sim-server ]; then
            tar -czf "release-files/space-sim-server-${TAG}-macos-arm64.tar.gz" -C all-artifacts/space-sim-macos/dist-server space-sim-server NODE-LICENSE.txt
          elif [ -f all-artifacts/space-sim-macos/space-sim-server ]; then
            tar -czf "release-files/space-sim-server-${TAG}-macos-arm64.tar.gz" -C all-artifacts/space-sim-macos space-sim-server NODE-LICENSE.txt
          fi

          # Offline player and editable content
          if [ -f verified-build/dist/space-lab-offline.html ]; then
            cp verified-build/dist/space-lab-offline.html "release-files/space-lab-${TAG}-offline.html"
          fi
          cp LICENSE CREDITS.md release-files/
          find verified-build/dist -maxdepth 1 -name "*.spacegame" -exec cp {} release-files/ \;
          find verified-build/dist -maxdepth 1 -name "*.spaceuniverse" -exec cp {} release-files/ \;

          if [ -d verified-build/dist/universes ]; then
            tar -czf "release-files/space-sim-universes-${TAG}.tar.gz" -C verified-build/dist universes
          fi

          # Android APK (debug-signed, for sideloading)
          if [ -f all-artifacts/space-sim-android-apk/app-debug.apk ]; then
            cp all-artifacts/space-sim-android-apk/app-debug.apk "release-files/space-sim-${TAG}-android.apk"
          fi

          # Hash the individual platform and content downloads.
          cd release-files
          sha256sum * > SHA256SUMS.txt
          ls -lh
      - name: Verify prepared downloads
        env:
          BUILD_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('snapshot-{0}', github.sha) }}
        run: python3 scripts/verify_release_distribution.py release-files "$BUILD_TAG" --require-android
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release-files/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: distribution
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release-files
      - name: Verify downloads after artifact transfer
        env:
          BUILD_TAG: ${{ github.ref_name }}
        run: python3 scripts/verify_release_distribution.py release-files "$BUILD_TAG" --require-android
      - name: Publish verified downloads
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NAME: ${{ needs.distribution.outputs.version }}
        with:
          script: |
            await require('./.github/scripts/finalize-release.cjs')({ github, context, core });
