name: Auto Package Releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            game_bin: dist-desktop/space-sim
            server_bin: dist-server/space-sim-server
          - os: windows-2025
            platform: windows
            game_bin: dist-desktop/space-sim.exe
            server_bin: dist-server/space-sim-server.exe
          - os: macos-15
            platform: macos
            game_bin: dist-desktop/space-sim
            server_bin: dist-server/space-sim-server
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:game-exe
      - run: npm run build:server-exe
      - uses: actions/upload-artifact@v4
        with:
          name: space-sim-${{ matrix.platform }}
          path: |
            ${{ matrix.game_bin }}
            ${{ matrix.server_bin }}
            dist-desktop/NODE-LICENSE.txt
          if-no-files-found: error

  package-web-offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: space-sim-offline-html
          path: |
            dist/space-lab-offline.html
            dist/space-sim-offline.html
            dist/space-sim.spacegame
            dist/space-sim.spaceuniverse
            dist/universes/

  package-android:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm ci
      - run: npm run build
      - name: Build Android via packaging tool
        run: node scripts/package.mjs --target=android
      - uses: actions/upload-artifact@v4
        with:
          name: space-sim-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  release:
    needs: [package-desktop, package-web-offline]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
      - name: Prepare Release Distribution Files
        run: |
          mkdir -p release-files

          # Linux Standalone Executables
          if [ -f all-artifacts/space-sim-linux/dist-desktop/space-sim ]; then
            cp all-artifacts/space-sim-linux/dist-desktop/space-sim release-files/space-sim-linux-x64
            chmod +x release-files/space-sim-linux-x64
            tar -czf release-files/space-sim-linux-x64.tar.gz -C all-artifacts/space-sim-linux/dist-desktop space-sim
          elif [ -f all-artifacts/space-sim-linux/space-sim ]; then
            cp all-artifacts/space-sim-linux/space-sim release-files/space-sim-linux-x64
            chmod +x release-files/space-sim-linux-x64
            tar -czf release-files/space-sim-linux-x64.tar.gz -C all-artifacts/space-sim-linux space-sim
          fi

          # Linux Dedicated Server
          if [ -f all-artifacts/space-sim-linux/dist-server/space-sim-server ]; then
            cp all-artifacts/space-sim-linux/dist-server/space-sim-server release-files/space-sim-server-linux-x64
            chmod +x release-files/space-sim-server-linux-x64
            tar -czf release-files/space-sim-server-linux-x64.tar.gz -C all-artifacts/space-sim-linux/dist-server space-sim-server
          elif [ -f all-artifacts/space-sim-linux/space-sim-server ]; then
            cp all-artifacts/space-sim-linux/space-sim-server release-files/space-sim-server-linux-x64
            chmod +x release-files/space-sim-server-linux-x64
            tar -czf release-files/space-sim-server-linux-x64.tar.gz -C all-artifacts/space-sim-linux space-sim-server
          fi

          # Windows Standalone Executables
          if [ -f all-artifacts/space-sim-windows/dist-desktop/space-sim.exe ]; then
            (cd all-artifacts/space-sim-windows/dist-desktop && zip -j ../../../release-files/space-sim-windows-x64.zip space-sim.exe)
          elif [ -f all-artifacts/space-sim-windows/space-sim.exe ]; then
            (cd all-artifacts/space-sim-windows && zip -j ../../release-files/space-sim-windows-x64.zip space-sim.exe)
          fi

          # Windows Dedicated Server
          if [ -f all-artifacts/space-sim-windows/dist-server/space-sim-server.exe ]; then
            (cd all-artifacts/space-sim-windows/dist-server && zip -j ../../../release-files/space-sim-server-windows-x64.zip space-sim-server.exe)
          elif [ -f all-artifacts/space-sim-windows/space-sim-server.exe ]; then
            (cd all-artifacts/space-sim-windows && zip -j ../../release-files/space-sim-server-windows-x64.zip space-sim-server.exe)
          fi

          # macOS Standalone Executables
          if [ -f all-artifacts/space-sim-macos/dist-desktop/space-sim ]; then
            tar -czf release-files/space-sim-macos-arm64.tar.gz -C all-artifacts/space-sim-macos/dist-desktop space-sim
          elif [ -f all-artifacts/space-sim-macos/space-sim ]; then
            tar -czf release-files/space-sim-macos-arm64.tar.gz -C all-artifacts/space-sim-macos space-sim
          fi

          # macOS Dedicated Server
          if [ -f all-artifacts/space-sim-macos/dist-server/space-sim-server ]; then
            tar -czf release-files/space-sim-server-macos-arm64.tar.gz -C all-artifacts/space-sim-macos/dist-server space-sim-server
          elif [ -f all-artifacts/space-sim-macos/space-sim-server ]; then
            tar -czf release-files/space-sim-server-macos-arm64.tar.gz -C all-artifacts/space-sim-macos space-sim-server
          fi

          # Offline Web & Bundles
          find all-artifacts/space-sim-offline-html -name "*.html" -exec cp {} release-files/ \;
          find all-artifacts/space-sim-offline-html -name "*.spacegame" -exec cp {} release-files/ \;
          find all-artifacts/space-sim-offline-html -name "*.spaceuniverse" -exec cp {} release-files/ \;

          # Android APK if present
          find all-artifacts/ -name "*.apk" -exec cp {} release-files/space-sim-android-debug.apk \; || true

          # Generate Checksums
          cd release-files
          sha256sum * > SHA256SUMS.txt
          ls -lh
      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0' }}
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
