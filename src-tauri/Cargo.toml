[package]
name = "space-sim"
version = "0.3.0"
description = "Spacelab - Modular 2D Space Simulation"
authors = ["Spacelab contributors"]
edition = "2021"

[lib]
name = "space_sim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
